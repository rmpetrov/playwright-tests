name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install lint dependencies
        run: python -m pip install ruff==0.14.13

      - name: Run ruff check
        run: ruff check .

      - name: Run ruff format check
        run: ruff format --check .

  api-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: requirements-api.txt

      - name: Install dependencies
        run: |
          python -m pip install -r requirements-api.txt

      - name: Run API tests
        run: |
          pytest -v api_tests \
            -m "not quarantine" \
            --html=html-report/api/index.html \
            --self-contained-html \
            --alluredir=allure-results-api

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-results-api
          path: allure-results-api
          if-no-files-found: warn

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: html-report-api
          path: html-report/api
          if-no-files-found: warn

  ui-tests:
    runs-on: ubuntu-latest
    env:
      ENV: ci
      PW_BASE_URL: http://127.0.0.1:8000
      PW_USERNAME: test_user
      PW_PASSWORD: test_password
      LOCAL_APP_HOST: 127.0.0.1
      LOCAL_APP_PORT: "8000"
      PYTHONPATH: ${{ github.workspace }}
      LOCAL_APP_READY: "false"
      PYTEST_RERUNS: "1"
      PYTEST_RERUNS_DELAY: "2"

    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: |
            requirements-api.txt
            requirements-ui.txt

      - name: Install dependencies
        run: |
          python -m pip install -r requirements-api.txt -r requirements-ui.txt
          python -m playwright install --with-deps ${{ matrix.browser }}

      - name: Start local app
        run: |
          python3 -m local_app > local-app.log 2>&1 &
          echo "LOCAL_APP_PID=$!" >> "$GITHUB_ENV"

      - name: Wait for local app readiness
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health | grep -qx "ok"; then
              echo "LOCAL_APP_READY=true" >> "$GITHUB_ENV"
              echo "Local app is ready on attempt ${attempt}"
              exit 0
            fi
            sleep 1
          done

          echo "Local app failed readiness checks after 30 attempts"
          tail -n 50 local-app.log || true
          exit 1

      - name: Run UI tests
        run: |
          make test-ui-${{ matrix.browser }} \
            EXTRA_PYTEST_ARGS="--reruns=${{ env.PYTEST_RERUNS }} --reruns-delay=${{ env.PYTEST_RERUNS_DELAY }}"

      - name: Show local app log on failure
        if: failure()
        run: cat local-app.log || true

      - name: Stop local app
        if: always()
        run: |
          if [[ -n "${LOCAL_APP_PID:-}" ]]; then
            kill "${LOCAL_APP_PID}" || true
          fi

      - name: Upload local app log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: local-app-log-${{ matrix.browser }}
          path: local-app.log
          if-no-files-found: warn

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-results-ui-${{ matrix.browser }}
          path: allure-results-ui
          if-no-files-found: warn

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: html-report-ui-${{ matrix.browser }}
          path: html-report/ui
          if-no-files-found: warn

      - name: Upload test-results (if any)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.browser }}
          path: test-results
          if-no-files-found: warn

      - name: Publish UI job summary
        if: always()
        run: |
          {
            echo "## UI job summary"
            echo ""
            echo "- Browser under test: \`${{ matrix.browser }}\`"
            echo "- Local app ready: \`${LOCAL_APP_READY}\`"
            echo "- Local app log artifact: \`local-app-log-${{ matrix.browser }}\`"
            echo "- UI HTML report artifact: \`html-report-ui-${{ matrix.browser }}\`"
            echo "- UI Allure artifact: \`allure-results-ui-${{ matrix.browser }}\`"
            echo "- Playwright artifacts: \`test-results-${{ matrix.browser }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  publish-reports:
    needs: [lint, api-tests, ui-tests]
    if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Download API HTML report
        uses: actions/download-artifact@v8
        with:
          name: html-report-api
          path: html-report/api

      - name: Download UI HTML reports
        uses: actions/download-artifact@v8
        with:
          pattern: html-report-ui-*
          path: downloaded-reports
          merge-multiple: false

      - name: Assemble and validate report site
        run: |
          set -euo pipefail
          for browser in chromium firefox webkit; do
            mkdir -p "html-report/ui/$browser"
            cp -r "downloaded-reports/html-report-ui-$browser/." "html-report/ui/$browser/"
            test -s "html-report/ui/$browser/index.html"
          done
          test -s html-report/api/index.html
          python scripts/generate_pages_index.py
          test -s html-report/index.html

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: html-report

  deploy-pages:
    needs: publish-reports
    if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy HTML reports to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
